version: "3.9"

services:
  ag-ui-travel-agent:
    build: .
    image: pricecs/ag-ui-travel-agent:latest
    container_name: ag-ui-travel-agent
    ports:
      - "8000:8000"
    environment:
      PORT:           "8000"
      ALLOWED_ORIGIN: "https://cprice-ping.github.io,http://localhost:8080"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      LLM_MODEL:      "${LLM_MODEL:-gemini-2.0-flash}"
    restart: unless-stopped
    healthcheck:
      test:     ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout:  5s
      retries:  3
