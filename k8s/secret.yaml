# kubectl create secret generic travelagent-secrets \
#   --namespace travelagent \
#   --from-literal=OPENAI_API_KEY=sk-...
#
# Or apply this template after base64-encoding your value:
#   echo -n 'sk-...' | base64
#
apiVersion: v1
kind: Secret
metadata:
  name:      travelagent-secrets
  namespace: travelagent
type: Opaque
data:
  # Replace with: echo -n '<your-openai-api-key>' | base64
  OPENAI_API_KEY: ""
