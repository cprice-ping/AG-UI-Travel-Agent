# kubectl create secret generic travelagent-secrets \
#   --namespace travelagent \
#   --from-literal=GEMINI_API_KEY=AIza...
#
# Or apply this template after base64-encoding your value:
#   echo -n 'AIza...' | base64
#
apiVersion: v1
kind: Secret
metadata:
  name:      travelagent-secrets
  namespace: travelagent
type: Opaque
data:
  # Replace with: echo -n '<your-gemini-api-key>' | base64
  GEMINI_API_KEY: ""
